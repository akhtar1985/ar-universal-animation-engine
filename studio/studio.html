<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UAE Animation Studio</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; background: #0f0f0f; color: #e0e0e0; height: 100vh; display: flex; }

    .uae-studio    { display: flex; width: 100%; height: 100%; }
    .studio-sidebar { width: 280px; background: #1a1a1a; padding: 16px; overflow-y: auto; border-right: 1px solid #2a2a2a; }
    .studio-main   { flex: 1; display: flex; flex-direction: column; }

    .studio-preview { flex: 1; display: flex; align-items: center; justify-content: center; background: #141414; }
    .preview-box    { width: 120px; height: 120px; background: #6c63ff; border-radius: 12px; }

    .studio-controls label  { display: flex; flex-direction: column; gap: 4px; margin-bottom: 12px; font-size: 13px; color: #aaa; }
    .studio-controls select,
    .studio-controls input,
    .studio-controls textarea { background: #252525; border: 1px solid #333; color: #e0e0e0; padding: 6px 8px; border-radius: 6px; font-size: 13px; width: 100%; }
    .studio-controls button  { width: 100%; padding: 8px; background: #6c63ff; color: #fff; border: none; border-radius: 6px; cursor: pointer; font-size: 14px; margin-top: 4px; }

    .studio-scrubber { display: flex; align-items: center; gap: 8px; padding: 10px 16px; background: #1a1a1a; border-top: 1px solid #2a2a2a; font-size: 12px; color: #888; }
    .studio-scrubber input { accent-color: #6c63ff; }

    .studio-export  { padding: 12px 16px; background: #1a1a1a; border-top: 1px solid #2a2a2a; }
    .studio-export button { padding: 6px 14px; background: #333; color: #e0e0e0; border: 1px solid #444; border-radius: 6px; cursor: pointer; font-size: 13px; margin-right: 8px; }
    .export-output  { margin-top: 10px; background: #0f0f0f; padding: 12px; border-radius: 6px; font-size: 12px; color: #a8ff78; overflow-x: auto; white-space: pre; }
  </style>
</head>
<body>
  <div id="studio-root"></div>
  <script type="module">
    import { mountStudio } from './index.js';
    mountStudio(document.getElementById('studio-root'));
  </script>
</body>
</html>
